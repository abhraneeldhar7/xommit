name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Build Windows
        working-directory: cli
        run: |
          npm install
          npm run build:windows

      - name: Verify version matches tag
        working-directory: cli
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          $expected = "v$($pkg.version)"
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match package.json version $expected"
            exit 1
          }

      - name: Upload Windows binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/bin/xommit.exe
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libcurl4-openssl-dev

      - name: Build Linux
        working-directory: cli
        run: |
          npm install
          npm run build:linux

      - name: Verify version matches tag
        working-directory: cli
        run: |
          pkg=$(cat package.json | jq -r .version)
          tag="${{ github.ref_name }}"
          expected="v$pkg"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match package.json version $expected"
            exit 1
          fi

      - name: Upload Linux binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/bin/xommit
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}