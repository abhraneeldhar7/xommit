name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: '16.2.0'
          architecture: x64
          exception: seh
          threads: posix
          install-dir: D:\mingw64

      - name: Add MinGW to PATH
        run: echo "D:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Verify version matches tag
        working-directory: cli
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          $expected = "v$($pkg.version)"
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match package.json version $expected"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/bin/xommit.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}